<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf6">
<title>تعارف يصنع فرصة | PEIA</title>
<style>
:root{--navy:#10264b;--blue:#1684b7;--red:#cf2450;--green:#78a83c;--gold:#f5ad32;--paper:#fbfaf6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#eeeae2;font-family:Tahoma,Arial,sans-serif;color:var(--navy)}
.card{width:min(100%,650px);min-height:510px;background:var(--paper);border:1px solid #d4d0c8;border-radius:24px;padding:22px 25px 25px;box-shadow:0 9px 24px #17233a22;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.pattern{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.17;pointer-events:none}
.top{position:relative;z-index:1;width:100%;display:flex;align-items:flex-start;justify-content:space-between}
.num{font-size:25px;font-weight:800;border-bottom:2px solid var(--blue);padding:0 2px 5px;direction:ltr}
.logo{width:94px;height:auto;object-fit:contain}
.center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;padding:22px 4px}
.icon{width:76px;height:76px;border-radius:25px;background:#e6f3f8;display:grid;place-items:center;font-size:37px;margin-bottom:20px;border:1px solid #d5e8ee}
.kicker{font-size:14px;color:#63728a;font-weight:700;margin-bottom:10px}
h1{font-size:clamp(25px,5.6vw,36px);line-height:1.65;margin:0;max-width:530px;font-weight:800}
.instruction{font-size:15px;color:#53627a;line-height:1.9;margin:15px 0 0}
button{position:relative;z-index:2;border:0;border-radius:12px;background:var(--navy);color:white;padding:15px 22px;font:700 16px Tahoma,Arial,sans-serif;width:min(100%,330px);cursor:pointer}
button:active{transform:scale(.99)}
.bottom{position:relative;z-index:1;width: min(230px,70%);height:4px;border-radius:8px;background:linear-gradient(90deg,#1684b7 0 25%,#78a83c 25% 50%,#f5ad32 50% 75%,#cf2450 75%);margin-top:20px}
@media(max-width:420px){.card{min-height:490px;padding:18px}.logo{width:82px}}
</style>
</head>

  <div class="icon">✦</div>
  <div class="kicker">تعارف يصنع فرصة</div>
  <h1 id="question">عرّفنا بنفسك وما دورك في قطاع الفعاليات؟</h1>
  <p class="instruction">شارك إجابتك شفهيًا مع شخص جديد، فقد يبدأ من هنا تعارف يصنع فرصة.</p>
</section>
<button id="next" type="button">اسحب سؤالك العشوائي</button>
<div class="bottom"></div>
</main>
<script>
const questions = [
"عرّفنا بنفسك وما دورك في قطاع الفعاليات؟",
"ما أول فعالية شاركت في تنظيمها؟",
"ما المهارة التي ترى أنها تصنع الفرق في منظم الفعاليات؟",
"ما الفعالية التي تتمنى أن تكون جزءًا من فريق تنظيمها؟",
"ما المجال الذي ترغب في تطوير خبراتك فيه ضمن قطاع الفعاليات؟",
"ما الوظيفة التي تطمح للوصول إليها في قطاع الفعاليات؟",
"ما النصيحة التي تقدمها لشخص يبدأ مسيرته المهنية في المجال؟",
"ما المهارة التي تبحث عنها الشركات اليوم في موظفي الفعاليات؟",
"هل سبق أن حصلت على فرصة مهنية من خلال تعارف أو علاقة عمل؟",
"ما نوع التعاون المهني الذي تبحث عنه حاليًا؟",
"لو استطعت التعرف على شخص واحد من قطاع الفعاليات اليوم، فمن سيكون تخصصه؟",
"ما الشيء الذي يمكنك تقديمه أو مشاركته مع مجتمع الفعاليات؟",
"ما وظيفتك؟",
"ماذا تريد أن تعرف عن الفعاليات؟"
];
let last = -1;
function drawQuestion(){
  let i;
  do { i = Math.floor(Math.random()*questions.length); } while(i===last);
  last=i;
  document.getElementById("number").textContent=String(i+1).padStart(2,"0");
  document.getElementById("question").textContent=questions[i];
  document.getElementById("next").textContent="اختيار سؤال آخر";
}
document.getElementById("next").addEventListener("click",drawQuestion);
</script>
